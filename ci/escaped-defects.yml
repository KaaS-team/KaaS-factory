name: escaped-defects

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun scripts/escaped-defects.ts --repo "${{ github.repository }}" --days 2
        env:
          GH_TOKEN: ${{ github.token }}
