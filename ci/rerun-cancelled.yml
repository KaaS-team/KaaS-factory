name: rerun-cancelled

# A cancelled ci run on a PR's current head gets a fresh run, so the PR is never left with no result.
# A run cancelled because a newer push superseded it is left alone (scripts/rerun-cancelled.ts decides).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'cancelled' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: bun scripts/rerun-cancelled.ts "${{ github.repository }}" "${{ github.event.workflow_run.id }}"
        env:
          GH_TOKEN: ${{ github.token }}
