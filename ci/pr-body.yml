name: pr-body

# The only workflow that runs when a PR description is edited. It holds the two checks that read the body,
# so a typo fix reruns them and nothing else, and cannot cancel a green ci run. ci.yml does not list
# `edited`. Branch protection requires the `body` job in addition to ci's `push`.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  body:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Full history, so the weakening-test check can diff against the base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: The PR body follows the template (CONTRIBUTING.md)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bun scripts/check-pr-body.ts

      - name: A weakening test change states its reason (CONTRIBUTING.md)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bun scripts/check-tests-only.ts "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
