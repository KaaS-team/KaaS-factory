name: ci

on:
  push:
    branches: [main, next, "go/**"]
  pull_request:

# A newer push to the same ref cancels the run it supersedes, so minutes go to the latest tree only.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Branch protection on main requires this job id.
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, so the pull request checks below can read every commit in the pull request.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v3
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          install-only: true

      - name: Every commit is signed off (DCO, CONTRIBUTING.md)
        if: github.event_name == 'pull_request'
        run: go run ./tools/prcheck dco "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"

      - name: The PR body follows the template (CONTRIBUTING.md)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: go run ./tools/prcheck body

      - name: A weakening test change states its reason (CONTRIBUTING.md)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: go run ./tools/prcheck tests-only "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"

      - run: just check
