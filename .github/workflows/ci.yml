name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the run it supersedes, so minutes go to the latest tree only.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install uv (for skills-ref validate)
        uses: astral-sh/setup-uv@v3

      - name: Install tmux (tests/tmux.test.ts drives a real one)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux

      - name: Install dependencies
        run: make install

      # An empty HOME, so a check that passes only with one machine's ~/.claude or caches fails here.
      - name: make check
        run: HOME="$(mktemp -d)" make check

  # Every check must bite: each mutation in tests/mutations.json turns its test red.
  check-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install dependencies
        run: make install
      - name: make check-mutations
        run: make check-mutations

  # The Dockerfile ships the VM run mode (plan "Run anywhere"). An image that
  # only builds when someone remembers to try it by hand rots the first time
  # a base-image tag or a pinned tool version moves — this is the check that
  # keeps it honest (Rule 0: an unwired check did not ship).
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: software-factory:ci
