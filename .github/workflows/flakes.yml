name: flakes

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs every test three times under the race detector. A test that fails in any run is a flake or a race;
  # the job fails and the summary names it.
  flakes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run every test three times
        run: |
          set -o pipefail
          go test -race -count=3 ./... 2>&1 | tee test.log
      - name: Name the failures
        if: failure()
        run: grep -E '^(--- FAIL|FAIL)' test.log | sort -u >> "$GITHUB_STEP_SUMMARY"
