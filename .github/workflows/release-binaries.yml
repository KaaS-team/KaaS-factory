# Staged outside .github/workflows: an operator moves it there.
name: release-binaries
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - bun-darwin-arm64
          - bun-darwin-x64
          - bun-linux-arm64
          - bun-linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: make install
      - run: bun scripts/build-binary.ts --target ${{ matrix.target }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: factory-${{ matrix.target }}
          path: dist/
