name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # goreleaser builds the static binaries in .goreleaser.yaml, writes checksums.txt, attaches both to the
  # release and pushes the formula to KaaS-team/homebrew-tap.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # A fine-grained token with contents:write on KaaS-team/homebrew-tap only.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
