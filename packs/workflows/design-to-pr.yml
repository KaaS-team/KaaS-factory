# Use to build UI from a design file: a Penpot MCP export or a screenshot path named in the ticket.
# Plan the components against the repo's design system, build test-first, run the visual check,
# then a fresh session verifies before the PR.
name: design-to-pr
steps:
  triage: { uses: triage, label: "factory:triaging", next: design, tier: small, budget: 150000 }
  design:
    uses: plan
    label: "factory:planning"
    mcp: [penpot]
    tier: large
    budget: 400000
    skills: [factory-plan, factory-architecture]
    prompt: |
      Read the design source named in the ticket: a Penpot export through the penpot server, or the
      screenshot path given. Plan the components against the repo's design system: reuse what exists,
      list what is new, and name the test each component gets first.
    next:
      - { park: awaiting-approval, approve: build, revise: design }
  build: { uses: build, label: "factory:building", next: visual, tier: large, budget: 600000, skills: [factory-build] }
  visual:
    uses: check
    label: "factory:comparing"
    run: |
      .factory/visual-check.sh | tee .factory/visual.log
      grep -q '^FACTORY_GATES:' .factory/visual.log
    reject: build
    next: verify
  verify: { uses: verify, label: "factory:verifying", next: pr, reject: build, tier: large, budget: 300000, skills: [factory-verify] }
  pr: { uses: pr, label: "factory:in-review", revise: build, tier: small, budget: 100000, skills: [factory-pr] }
