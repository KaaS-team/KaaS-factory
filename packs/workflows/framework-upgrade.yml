# Use to move to a new major version of a framework, one module at a time:
# the plan splits the work into up to three lanes, each lane builds its share in parallel, and the
# join check runs the gate before a fresh session verifies the whole change.
name: framework-upgrade
steps:
  triage: { uses: triage, label: "factory:triaging", next: plan, tier: small, budget: 150000 }
  plan:
    uses: plan
    label: "factory:planning"
    tier: large
    budget: 400000
    skills: [factory-plan, factory-architecture]
    next:
      - { park: awaiting-approval, approve: split, revise: plan }
  split:
    uses: fanout
    next: [{ to: build-lane-1 }, { to: build-lane-2 }, { to: build-lane-3 }]
  build-lane-1: { uses: build, label: "factory:building-1", prompt: "Build lane 1: the first third of the modules in the plan.", next: join, tier: large, budget: 600000, skills: [factory-build] }
  build-lane-2: { uses: build, label: "factory:building-2", prompt: "Build lane 2: the second third of the modules in the plan.", next: join, tier: large, budget: 600000, skills: [factory-build] }
  build-lane-3: { uses: build, label: "factory:building-3", prompt: "Build lane 3: the last third of the modules in the plan.", next: join, tier: large, budget: 600000, skills: [factory-build] }
  join: { uses: check, label: "factory:joining", run: ".factory/gates.sh", reject: plan, next: residue }
  residue: { uses: check, label: "factory:residue", run: "sh packs/checks/ast-grep-residue/check.sh", reject: plan, next: verify }
  verify: { uses: verify, label: "factory:verifying", next: pr, reject: plan, tier: large, budget: 400000, skills: [factory-verify] }
  pr: { uses: pr, label: "factory:in-review", revise: plan, tier: small, budget: 100000, skills: [factory-pr] }
