# Use to rewrite many call sites by rule: an agent authors an ast-grep rule with valid and invalid cases,
# the transform step checks and tests the rule, then applies it to the tree with no model call.
name: transform
steps:
  triage: { uses: triage, label: "factory:triaging", next: plan, tier: small, budget: 150000 }
  plan:
    uses: plan
    label: "factory:planning"
    tier: large
    budget: 400000
    skills: [factory-plan, factory-architecture]
    next:
      - { park: awaiting-approval, approve: author, revise: plan }
  author: { uses: build, label: "factory:authoring", prompt: "Write one ast-grep rule per pattern in the plan under .factory/rules, with a tests file holding valid and invalid cases for each.", next: apply, tier: large, budget: 600000, skills: [factory-build] }
  apply: { uses: transform, label: "factory:applying", rules: .factory/rules, reject: author, next: join }
  join: { uses: check, label: "factory:joining", run: ".factory/gates.sh", reject: author, next: verify }
  verify: { uses: verify, label: "factory:verifying", next: pr, reject: author, tier: large, budget: 400000, skills: [factory-verify] }
  pr: { uses: pr, label: "factory:in-review", revise: plan, tier: small, budget: 100000, skills: [factory-pr] }
