# Use when a repo has no agent context files: read the code and CI, write the context files
# (AGENTS.md and rules) as a PR, have a person approve the plan first, and verify the files in a fresh session.
name: onboarding
steps:
  triage: { uses: triage, label: "factory:triaging", next: plan, tier: small, budget: 150000 }
  plan:
    uses: plan
    label: "factory:planning"
    tier: large
    budget: 400000
    skills: [factory-plan, factory-architecture]
    next:
      - { park: awaiting-approval, approve: build, revise: plan }
  build: { uses: build, label: "factory:building", next: verify, tier: large, budget: 500000, skills: [factory-build] }
  verify: { uses: verify, label: "factory:verifying", next: pr, reject: build, tier: large, budget: 300000, skills: [factory-verify] }
  pr: { uses: pr, label: "factory:in-review", revise: build, tier: small, budget: 100000, skills: [factory-pr] }
